[workspace]
members = ["crates/asl", "crates/engine", "crates/logstream", "crates/proto", "crates/scheduler", "crates/server", "crates/storage", "crates/task-service", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = ["mirror"]

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
auto_impl = "1"
clap = { version = "4", features = ["derive"] }
derive_more = { version = "1", features = ["from", "into"] }
jsonata-core = "2"
jsonptr = { version = "0.8", features = ["serde"] }
prost = "0.13"
prost-build = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.21.0"
spica-asl = { path = "crates/asl" }
spica-engine = { path = "crates/engine" }
spica-logstream = { path = "crates/logstream" }
spica-proto = { path = "crates/proto" }
spica-scheduler = { path = "crates/scheduler" }
spica-storage = { path = "crates/storage" }
spica-task-service = { path = "crates/task-service" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["time"] }
time = { version = "0.3", features = ["parsing", "formatting", "serde-well-known"] }
tonic = "0.13"
tonic-build = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
