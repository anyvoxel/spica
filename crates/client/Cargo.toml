[package]
name = "spica-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The single client-side SDK face every spica *consumer* links: the thin `Client` (control plane) plus
# the `worker` module (task consumer), both engine-free. It depends on `spica-proto` (the wire
# contract) + `tonic` (the transport) + JSON/timing utils the worker loop needs — NOT on
# `spica-engine`. See `lib.rs`.
[dependencies]
spica-proto = { workspace = true }
tonic.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ulid.workspace = true
